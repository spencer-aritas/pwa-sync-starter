
services:
  api:
    build: ./server
    environment:
      - TZ=America/Denver
      - API_ORIGINS=http://localhost:5173,http://localhost:4173
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
  web:
    build: ./web
    ports:
      - "5173:5173"
      - "4173:4173"
    environment:
      - VITE_API_BASE=/api
    volumes:
      - ./web:/usr/src/app
    depends_on:
      - api
