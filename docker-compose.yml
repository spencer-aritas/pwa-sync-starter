
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  api:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - TZ=America/Denver
      - API_ORIGINS=https://outreachintake.aritasconsulting.com
    volumes:
      - ./server:/app
      
  web:
    build: ./web
    environment:
      - VITE_API_BASE=/api
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
